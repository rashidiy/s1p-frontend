version: '3.8'

services:
  # Next.js Application (Production)
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [prod]
    container_name: s1p-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_OWNER_SUBDOMAIN=${NEXT_PUBLIC_OWNER_SUBDOMAIN:-owner}
      - NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN:-localhost}
    expose:
      - "3000"
    networks:
      - s1p-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    profiles: [prod]
    container_name: s1p-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - s1p-network
    depends_on:
      - nextjs

  # Next.js Application (Development)
  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: [dev]
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  s1p-network:
    driver: bridge
