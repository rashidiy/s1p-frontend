# Upstream to Next.js application
upstream nextjs_backend {
    server nextjs:3000;
    keepalive 32;
}

# Extract subdomain from server name
map $host $subdomain {
    ~^(?<sub>[^.]+)\.localhost$ $sub;
    ~^(?<sub>[^.]+)\.domain\.com$ $sub;
    default "";
}

# Server block for all subdomains
server {
    listen 80;
    server_name *.localhost localhost *.domain.com domain.com;

    # Redirect to HTTPS in production (commented for development)
    # return 301 https://$server_name$request_uri;

    # For development, proxy directly
    location / {
        # Pass subdomain information to Next.js
        proxy_set_header X-Subdomain $subdomain;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy to Next.js
        proxy_pass http://nextjs_backend;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files caching
    location /_next/static {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Image optimization
    location /_next/image {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 60m;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

