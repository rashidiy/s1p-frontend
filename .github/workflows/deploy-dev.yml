name: Deploy to Dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        continue-on-error: true
        run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: s1p.uz
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /root/projects/deploy.sh frontend
